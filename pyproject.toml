[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snippen-sms-service"
dynamic = ["version"]
description = "SMS service for Snippen Booking"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Snippen", email = "admin@snippen.com" }
]
dependencies = [
    "packaging>=23.0",
]

[project.scripts]
snippen-sms = "snippen_sms.main:main_cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "packaging>=23.0",
]

[tool.setuptools.dynamic]
version = {attr = "snippen_sms.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"snippen_sms.migrations" = ["sql/*.sql"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
