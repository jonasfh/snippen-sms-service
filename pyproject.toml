[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snippen-sms-service"
version = "0.1.0"
description = "SMS service for Snippen Booking"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Snippen", email = "admin@snippen.com" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
